<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MYUSIC — Page Not Found</title>
  <meta name="description" content="MYUSIC — Share one song, twice a week. Available on iOS and Android." />
  <link rel="icon" type="image/png" href="/images/MYUSIC LOGO 1024X1024 - Copy.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@800&family=Inter:wght@400&display=swap" rel="stylesheet" />

  <style>
    /* ========================================
   RESET & BASE
   ======================================== */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html {
      scroll-behavior: smooth;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    body {
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      color: #FFFFFF;
      background: #0A0A14;
      overflow-x: hidden;
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    h1, h2, h3, h4, h5, h6 { font-family: 'Manrope', sans-serif; font-weight: 800; }
    a { color: inherit; text-decoration: none; }
    
    #content-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      position: relative;
    }

    .hero-logo {
      width: clamp(140px, 20vw, 240px);
      margin-bottom: 2rem;
      filter: brightness(0) invert(1);
    }

    h1 {
      font-size: clamp(2rem, 5vw, 4rem);
      line-height: 1.1;
      margin-bottom: 1rem;
    }

    p.subtitle {
      font-size: clamp(1rem, 1.6vw, 1.2rem);
      opacity: 0.8;
      margin-bottom: 2rem;
      line-height: 1.6;
      max-width: 600px;
    }

    /* Store badges */
    .store-badges {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
      margin-top: 1rem;
    }
    .store-badges a {
      display: inline-block;
      transition: transform 0.25s ease, opacity 0.25s ease;
    }
    .store-badges a:hover { transform: scale(1.05); }
    .store-badges a:active { transform: scale(0.98); }
    .store-badges img { height: 56px; width: auto; }

    /* Button */
    .btn-primary {
      display: inline-block;
      padding: 1rem 2rem;
      background: #EFD782;
      color: #0A0A14;
      font-family: 'Manrope', sans-serif;
      font-weight: 800;
      font-size: 0.95rem;
      border: 2px solid #EFD782;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.3s, transform 0.15s;
    }
    .btn-primary:hover { background: #f5e49e; }
    .btn-primary:active { transform: scale(0.97); }

    /* Footer */
    #footer {
      background: #000000;
      padding: 2rem;
      text-align: center;
    }
    #footer .footer-logo { width: 80px; margin: 0 auto 1rem; opacity: 0.8; }
    #footer .footer-copyright { font-size: 0.8rem; color: rgba(255, 255, 255, 0.35); }
    
    @media (max-width: 768px) {
      .store-badges { flex-direction: column; gap: 0.75rem; }
      .store-badges img { height: 50px; }
    }
  </style>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const path = window.location.pathname;
      const titleEl = document.getElementById("page-title");
      const descEl = document.getElementById("page-desc");
      const actionEl = document.getElementById("action-container");

      if (path.startsWith('/u/')) {
        // Deep linking / Profile sharing fallback
        document.title = "MYUSIC — You've been invited!";
        titleEl.textContent = "You're Invited";
        descEl.innerHTML = "You've been invited to check out a profile on MYUSIC!<br>Download the app to see it.";
        
        actionEl.innerHTML = `
          <div class="store-badges">
            <a href="https://apps.apple.com/us/app/myusic-app/id6757954538" target="_blank" rel="noopener" aria-label="Download MYUSIC on the App Store">
              <img src="https://tools.applemediaservices.com/api/badges/download-on-the-app-store/black/en-us?size=250x83" alt="Download on the App Store" />
            </a>
            <a href="https://play.google.com/store/apps/details?id=com.myusic.social" target="_blank" rel="noopener" aria-label="Get MYUSIC on Google Play">
              <img src="https://play.google.com/intl/en_us/badges/static/images/badges/en_badge_web_generic.png" alt="Get it on Google Play" />
            </a>
          </div>
        `;
      } else {
        // Standard 404
        titleEl.textContent = "Page Not Found";
        descEl.textContent = "The page you are looking for doesn't exist or has been moved.";
        
        actionEl.innerHTML = `
          <a href="/" class="btn-primary">Return to Homepage</a>
        `;
      }
    });
  </script>
</head>
<body>
  <div id="content-container">
    <a href="/"><img src="/images/logo.png" alt="MYUSIC Logo" class="hero-logo" /></a>
    <h1 id="page-title">Loading...</h1>
    <p class="subtitle" id="page-desc"></p>
    <div id="action-container"></div>
  </div>
  
  <footer id="footer">
    <a href="/"><img src="/images/logo.png" alt="MYUSIC" class="footer-logo" style="mix-blend-mode: screen;" /></a>
    <p class="footer-copyright">&copy; 2026 MYUSIC</p>
  </footer>
</body>
</html>
